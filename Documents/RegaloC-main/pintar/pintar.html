<body>
  <header>

      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../recuerdos/recuerdos.html">Recuerdos</a></li>

  </header>

  <main id="mandala" class="section-container">
    <h2>Pintar y Dibujar 🎨</h2>
    <p>Elegí un color y dibujá lo que quieras. ¡También podés cargar una foto nuestra para pintar encima!</p>
    
    <div class="paint-controls">
      <label>Color: <input type="color" id="colorPicker" value="#e60073"></label>
      <label>Grosor: <input type="range" id="brushSize" min="2" max="40" value="5"></label>
      <button id="undoBtn">Deshacer</button>
      <button id="clearCanvasBtn">Limpiar</button>
      <input type="file" id="bgImageLoader" accept="image/*" style="display:none;">
      <button id="uploadImageBtn">🖼️ Cargar Foto</button>
    </div>

    <canvas id="paintCanvas"></canvas>
  </main>

  <footer>
    <p>Con mucho amor 💕</p>
  </footer>
  
  <script src="../js/core.js"></script>
  <script src="../js/pintar.js"></script>
  <script src="../js/main.js"></script>
